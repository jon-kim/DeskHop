name: Release on master push

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      PROJECT_PATH: DeskHop/DeskHop.csproj
      RUNTIME: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Compute collision-proof version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $now = [DateTime]::UtcNow
          $base = "{0}.{1}.{2}" -f $now.Year, $now.DayOfYear, (($now.Hour * 60) + $now.Minute)

          $repo = "${{ github.repository }}"
          $rev = 0
          while ($true) {
            $candidate = "$base.$rev"
            $tag = "v$candidate"

            gh release view $tag --repo $repo *> $null
            if ($LASTEXITCODE -ne 0) {
              $LASTEXITCODE = 0
              break
            }

            $rev++
            if ($rev -gt 65535) {
              throw "Too many releases in one minute."
            }
          }

          "APP_VERSION=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PUBLISH_DIR=${{ github.workspace }}\artifacts\publish" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSET_DIR=${{ github.workspace }}\artifacts\assets" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH -c Release -r $env:RUNTIME --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:Version=$env:APP_VERSION /p:AssemblyVersion=$env:APP_VERSION /p:FileVersion=$env:APP_VERSION /p:InformationalVersion=$env:APP_VERSION -o $env:PUBLISH_DIR

      - name: Create zip asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:ASSET_DIR -Force | Out-Null
          $zipPath = Join-Path $env:ASSET_DIR "DeskHop-$env:TAG-$env:RUNTIME.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $env:PUBLISH_DIR "*") -DestinationPath $zipPath -CompressionLevel Optimal
          "ASSET_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          gh release create $env:TAG $env:ASSET_PATH --repo $repo --title "DeskHop $env:TAG" --generate-notes
